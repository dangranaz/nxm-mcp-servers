# Transition state: no members yet. Public MCP servers (e.g. nxm-docs-mcp) will
# be added here, derived from the private nxm-mcp-servers umbrella.
[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dangranaz/nxm-mcp-servers"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
